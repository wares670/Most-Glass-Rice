# Preload the wallpaper into memory (supports absolute paths)
preload = ~/Pictures/iPhoneDuo_A_Light.png

# Set the wallpaper on your monitor(s)
# Replace 'DP-1' with your actual monitor name (or leave empty to apply to all)
wallpaper = eDP-1,~/Pictures/iPhoneDuo_A_Light.png

# Optional: enable splash text rendering over the wallpaper
splash = false